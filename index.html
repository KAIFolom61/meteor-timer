
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>МЕТЕОР — Общие таймеры</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif;padding:25px}
h1{text-align:center;color:#e32626;letter-spacing:5px}
.subtitle{text-align:center;color:#aaa;margin-bottom:30px}
#status{text-align:center;color:#aaa;margin:15px}
.grid{max-width:1000px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.card{background:#171717;border:1px solid #8d1717;border-radius:12px;padding:20px;box-shadow:0 0 15px #300}
input{width:100%;padding:12px;margin:7px 0;background:#090909;color:white;border:1px solid #555;border-radius:6px;font-size:16px}
h2{color:#ff3939;margin-top:0}
.time{font-size:30px;text-align:center;font-weight:bold;margin:18px 0;color:#fff}
.end{text-align:center;color:#aaa;margin:12px 0}
button{padding:11px 15px;margin:5px 3px;border:0;border-radius:6px;background:#b51e1e;color:white;font-weight:bold;cursor:pointer}
button:hover{background:#ed3030}
</style>
</head>
<body>
<h1>МЕТЕОР</h1>
<div class="subtitle">ОБЩАЯ СИСТЕМА ТАЙМЕРОВ</div>
<div id="status">Подключение...</div>
<div class="grid" id="timers"></div>

<script>
const PROJECT_URL = "sb_publishable_3W9W2_tVMT3iJ_8-J1lsmg_aLu9W42O";
const PUBLISHABLE_KEY = "sb_secret_9hpg7jegZVELIzpRofQ44A_AlxDyH_P";
const db = window.supabase.createClient(PROJECT_URL, PUBLISHABLE_KEY);
const DURATION = 40 * 60 * 1000;

let positions = [];
let busy = false;
let channel;

function render(){
  const root = document.getElementById("timers");
  root.innerHTML = "";
  positions.forEach((p,i)=>{
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <h2>ПОЗИЦИЯ ${i+1}</h2>
      <input class="name" aria-label="Название позиции" placeholder="Название позиции">
      <input class="timeInput" type="time" aria-label="Время начала">
      <div class="time" id="left${i}">40:00</div>
      <div class="end" id="end${i}">Окончание: —</div>
      <button class="start">ЗАПУСТИТЬ</button>
      <button class="reset">СБРОСИТЬ</button>`;
    const name = card.querySelector(".name");
    const timeInput = card.querySelector(".timeInput");
    name.value = p.name || `ПОЗИЦИЯ ${i+1}`;
    timeInput.value = p.time || "";
    name.addEventListener("change",async()=>{
      positions[i].name = name.value.trim() || `ПОЗИЦИЯ ${i+1}`;
      await save();
    });
    timeInput.addEventListener("change",async()=>{
      positions[i].time = timeInput.value;
      await save();
    });
    card.querySelector(".start").onclick=async()=>{
      if(busy)return;
      const chosen = positions[i].time;
      if(chosen){
        const [h,m] = chosen.split(":").map(Number);
        const now = new Date();
        const start = new Date(now);
        start.setHours(h,m,0,0);
        if(start.getTime() > now.getTime()) start.setDate(start.getDate()-1);
        positions[i].start = start.getTime();
      }else{
        positions[i].start = Date.now();
        positions[i].time = new Date().toTimeString().slice(0,5);
      }
      await save();
    };
    card.querySelector(".reset").onclick=async()=>{
      positions[i].start = null;
      positions[i].time = "";
      timeInput.value = "";
      await save();
    };
    root.appendChild(card);
  });
  updateAll();
}

async function save(){
  if(busy)return;
  busy=true;
  document.getElementById("status").textContent="Сохранение...";
  const {error}=await db.from("meteor_timers").update({
    positions:positions,
    updated_at:new Date().toISOString()
  }).eq("id",1);
  busy=false;
  document.getElementById("status").textContent=error
    ?"Ошибка сохранения: "+error.message
    :"Данные сохранены для всех посетителей";
}

async function load(){
  const {data,error}=await db.from("meteor_timers")
    .select("positions").eq("id",1).single();
  if(error){
    document.getElementById("status").textContent="Ошибка загрузки: "+error.message;
    return;
  }
  positions=data.positions;
  render();
  document.getElementById("status").textContent="Подключено к общей базе";
  channel=db.channel("meteor-timers")
    .on("postgres_changes",{
      event:"UPDATE",schema:"public",table:"meteor_timers",filter:"id=eq.1"
    },payload=>{
      if(!busy){
        positions=payload.new.positions;
        render();
      }
    }).subscribe();
}

function updateAll(){
  positions.forEach((p,i)=>{
    const left=document.getElementById("left"+i);
    const end=document.getElementById("end"+i);
    if(!left || !end)return;
    if(!p.start){
      left.textContent="40:00";
      end.textContent="Окончание: —";
      return;
    }
    const finish=p.start+DURATION;
    const remaining=Math.max(0,finish-Date.now());
    const mins=Math.floor(remaining/60000);
    const secs=Math.floor((remaining%60000)/1000);
    left.textContent=String(mins).padStart(2,"0")+":"+String(secs).padStart(2,"0");
    end.textContent="Окончание: "+new Date(finish).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
    if(remaining===0)left.textContent="ВРЕМЯ ВЫШЛО";
  });
}
setInterval(updateAll,1000);
load();
</script>
</body>
</html>
